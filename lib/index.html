<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1D3B66">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231D3B66%22/%3E%3Cpath d=%22M7 10h18M7 16h11M7 22h7%22 stroke=%22white%22 stroke-width=%222.6%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22m18.5 22 3 3 5-5.5%22 stroke=%22white%22 stroke-width=%222.6%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Ka-Ching · התאמת בנק וחשבוניות</title>
<meta name="application-name" content="Ka-Ching">
<meta name="apple-mobile-web-app-title" content="Ka-Ching">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body data-tab="board">
<header class="topbar">
  <div class="wrap top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h9M4 17h6"/><path d="m14 17 2.5 2.5L21 15"/></svg></span>
      <div class="brand-t">
        <h1>Ka-Ching</h1>
        <p>התאמת בנק וחשבוניות, במקום אחד</p>
      </div>
    </div>
    <div class="period" role="group" aria-label="תקופה">
      <label for="pFrom">מתאריך<input type="date" id="pFrom"></label>
      <label for="pTo">עד תאריך<input type="date" id="pTo"></label>
    </div>
    <div class="actions top-actions">
      <button class="btn" id="btnExport" type="button"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>ייצוא לאקסל</span></button>
      <button class="btn icon" id="btnSettings" type="button" aria-label="הגדרות" title="הגדרות"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="btn primary" id="btnMatch" type="button">בצע התאמה</button>
      <button class="avatar" id="btnAccount" type="button" aria-label="החשבון שלי"><span id="accLetter">?</span><i class="adot" id="accDot"></i></button>
    </div>
  </div>
</header>

<div class="wrap">
  <label class="cam-btn" for="fileCamera">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    צלם חשבונית
    <input type="file" id="fileCamera" accept="image/*" capture="environment">
  </label>

  <div id="demoBanner"></div>
  <section class="summary" id="summary" aria-label="סיכום"></section>
  <div class="jobs" id="jobs"></div>

  <nav class="tabs" role="tablist" aria-label="תצוגות">
    <button class="tab" role="tab" id="tabbtn-board" data-tab="board" aria-selected="true" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>לוח<span class="tl-x"> עבודה</span></span></button>
    <button class="tab" role="tab" id="tabbtn-income" data-tab="income" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="m8 10 4 4 4-4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>הכנסות</span></button>
    <button class="tab" role="tab" id="tabbtn-expense" data-tab="expense" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4"/><path d="m8 8 4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>הוצאות</span></button>
    <button class="tab" role="tab" id="tabbtn-vat" data-tab="vat" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg><span>מע״מ</span></button>
    <button class="tab" role="tab" id="tabbtn-recurring" data-tab="recurring" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/></svg><span><span class="tl-x">הוראות </span>קבע</span></button>
    <button class="tab" role="tab" id="tabbtn-donations" data-tab="donations" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>תרומות</span></button>
    <button class="tab" role="tab" id="tabbtn-review" data-tab="review" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span>ממתינות<span class="tl-x"> לאישור</span></span><span class="cnt acc hidden" id="reviewCnt"></span></button>
    <button class="tab" role="tab" id="tabbtn-report" data-tab="report" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg><span><span class="tl-x">דוח </span>חוסרים</span><span class="cnt" id="reportCnt"></span></button>
    <button class="tab" role="tab" id="tabbtn-ask" data-tab="ask" aria-selected="false" type="button"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v10H9l-4 4z"/></svg><span>שאל<span class="tl-x"> את ה-AI</span></span></button>
  </nav>

  <main>
    <section id="tab-board" class="board" role="tabpanel" aria-labelledby="tabbtn-board">
      <!-- עמודה 1 -->
      <article class="col" id="colBank">
        <div class="col-h">
          <div class="t"><span class="step">1</span><h2>חשבונות בנק ואשראי</h2><span class="meta" id="bankMeta"></span></div>
          <label class="drop" id="dropBank" for="fileBank">
            <input type="file" id="fileBank" multiple accept=".csv,.xls,.xlsx,.xlsm,.html,.htm,.txt,.pdf">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            <span><b>העלאת קבצים מהבנק או מהאשראי</b><small>אקסל, CSV או PDF. אפשר לגרור לכאן כמה יחד</small></span>
          </label>
          <div class="sources" id="sources"></div>
          <div class="filters" id="txFilters">
            <button class="chipf" data-txf="all" aria-pressed="true" type="button">הכל</button>
            <button class="chipf" data-txf="missing" aria-pressed="false" type="button">חסר</button>
            <button class="chipf" data-txf="complete" aria-pressed="false" type="button">מותאם</button>
            <button class="chipf" data-txf="not_needed" aria-pressed="false" type="button">לא נדרש</button>
            <input type="search" id="txSearch" placeholder="חיפוש בית עסק או סכום" aria-label="חיפוש בתנועות">
          </div>
        </div>
        <div id="bankNotes"></div>
        <ul class="list" id="txList"></ul>
      </article>

      <!-- עמודה 2 -->
      <article class="col" id="colMail">
        <div class="col-h">
          <div class="t"><span class="step">2</span><h2>מייל</h2><span class="meta" id="mailMeta"></span></div>
          <div class="actions">
            <button class="btn outline" id="btnScan" type="button"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>סרוק חשבוניות ב-Gmail</button>
            <button class="btn ghost" id="btnRescan" type="button" title="קורא שוב גם מיילים שכבר נסרקו">סרוק מחדש</button>
          </div>
          <details class="adv">
            <summary>מה נחפש במייל</summary>
            <div class="inner">
              <div class="field"><label for="gq">מילות החיפוש (בתחביר של Gmail). התאריכים נלקחים מהתקופה למעלה, ועוד חודש אחריה, כי חשבוניות מגיעות לפעמים באיחור.</label>
                <textarea id="gq" rows="3"></textarea></div>
            </div>
          </details>
          <div class="filters" id="mailFilters">
            <button class="chipf" data-mf="all" aria-pressed="true" type="button">הכל</button>
            <button class="chipf" data-mf="doc" aria-pressed="false" type="button">עם מסמך</button>
            <button class="chipf" data-mf="link" aria-pressed="false" type="button">קישור בלבד</button>
            <button class="chipf" data-mf="irrelevant" aria-pressed="false" type="button">לא רלוונטי</button>
          </div>
        </div>
        <div id="mailNotes"></div>
        <ul class="list" id="mailList"></ul>
      </article>

      <!-- עמודה 3 -->
      <article class="col" id="colDocs">
        <div class="col-h">
          <div class="t"><span class="step">3</span><h2>מסמכים</h2><span class="meta" id="docsMeta"></span></div>
          <label class="drop" id="dropDocs" for="fileDocs">
            <input type="file" id="fileDocs" multiple accept=".pdf,.zip,image/jpeg,image/png,image/webp,image/gif">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span><b>חשבונית שלא הגיעה במייל?</b><small>צלם, או העלה PDF, תמונה או קובץ ZIP (למשל גיבוי ממורנינג)</small></span>
          </label>
          <div class="filters" id="docFilters">
            <button class="chipf" data-df="all" aria-pressed="true" type="button">הכל</button>
            <button class="chipf" data-df="matched" aria-pressed="false" type="button">מותאם</button>
            <button class="chipf" data-df="orphan" aria-pressed="false" type="button">ללא תנועה</button>
            <input type="search" id="docSearch" placeholder="חיפוש ספק, מספר או סכום" aria-label="חיפוש במסמכים">
          </div>
        </div>
        <div id="docNotes"></div>
        <ul class="list" id="docList"></ul>
      </article>
    </section>

    <section id="tab-income" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-income"></section>

    <section id="tab-expense" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-expense"></section>

    <section id="tab-recurring" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-recurring"></section>

    <section id="tab-donations" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-donations"></section>

    <section id="tab-vat" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-vat"></section>

    <section id="tab-review" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-review"></section>

    <section id="tab-report" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-report"></section>

    <section id="tab-ask" class="report hidden" role="tabpanel" aria-labelledby="tabbtn-ask">
      <div class="card">
        <div class="card-h"><h2>שאל את ה-AI על הנתונים</h2><span class="meta">התשובה מתבססת על התנועות והמסמכים שבתקופה שבחרת</span></div>
        <div class="ai-box">
          <div class="presets">
            <button class="btn small" data-preset="סכם לי בקצרה מה חסר, ממי כדאי לבקש חשבוניות קודם, ומה הסכום הכולל שעדיין לא מגובה במסמך." type="button">מה הכי דחוף להשלים?</button>
            <button class="btn small" data-preset="אילו ספקים חוזרים כל חודש, ובאילו חודשים חסרה מהם חשבונית?" type="button">ספקים קבועים</button>
            <button class="btn small" data-preset="האם יש חיובים כפולים או חיובים חשודים שכדאי לבדוק?" type="button">חיובים כפולים</button>
            <button class="btn small" data-preset="כמה מע&quot;מ מופיע בחשבוניות שנמצאו בתקופה, ומה ההוצאה לפי קטגוריה?" type="button">מע״מ והוצאות</button>
          </div>
          <div class="ask-row">
            <textarea id="askQ" placeholder="לדוגמה: כמה שילמתי על דלק בספטמבר, ולאילו תדלוקים אין חשבונית?" aria-label="שאלה"></textarea>
            <div class="actions" style="align-self:flex-end"><button class="btn primary" id="btnAsk" type="button">שאל</button><button class="btn hidden" id="btnAskStop" type="button">עצור</button></div>
          </div>
          <div class="ai-out" id="askOut"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="caps" id="caps"></footer>
</div>
<div id="loginRoot"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
